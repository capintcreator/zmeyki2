<style>

<script>
// ==================== ТОСТЫ И МОДАЛКИ ====================
function showToast(message, type) {
  const t = document.createElement('div');
  t.className = 'toast-msg';
  t.textContent = message;
  t.style.background = type === 'success' ? 'linear-gradient(135deg, #22c55e, #16a34a)' : type === 'error' ? 'linear-gradient(135deg, #ef4444, #b91c1c)' : 'linear-gradient(135deg, #667eea, #764ba2)';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; }, 2400);
  setTimeout(() => t.remove(), 3000);
}
function showModalConfirm(message, onYes) {
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  const card = document.createElement('div');
  card.className = 'confirm-card';
  card.innerHTML = '<div class="confirm-msg"></div><div class="confirm-btns"><button class="confirm-no">Отмена</button><button class="confirm-yes">ОК</button></div>';
  card.querySelector('.confirm-msg').textContent = message;
  overlay.appendChild(card);
  card.querySelector('.confirm-no').onclick = () => overlay.remove();
  card.querySelector('.confirm-yes').onclick = () => { overlay.remove(); onYes(); };
  document.body.appendChild(overlay);
}

// ==================== ЗВУК ====================
let audioCtx = null;
function getAudioCtx() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } return audioCtx; }
function playSound(type) {
  if (!state || !state.settings.sound) return;
  const ctx = getAudioCtx(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  if (type === 'win') {
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, now + i * 0.12);
      g.gain.linearRampToValueAtTime(0.08, now + i * 0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
      o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.4);
    });
    return;
  }
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  switch (type) {
    case 'dice': osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.15); gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15); osc.start(now); osc.stop(now + 0.15); break;
    case 'step': osc.type = 'sine'; osc.frequency.value = 800; gain.gain.setValueAtTime(0.04, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04); osc.start(now); osc.stop(now + 0.04); break;
    case 'green': osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2); gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25); osc.start(now); osc.stop(now + 0.25); break;
    case 'red': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.3); gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35); osc.start(now); osc.stop(now + 0.35); break;
    case 'yellow': osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15); osc.frequency.exponentialRampToValueAtTime(200, now + 0.4); gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); osc.start(now); osc.stop(now + 0.4); break;
    case 'miss': osc.type = 'triangle'; osc.frequency.value = 200; gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
  }
}
function vibrate(pattern) { if (!state || !state.settings.vibrate) return; if (navigator.vibrate) navigator.vibrate(pattern); }

// ==================== УТИЛИТЫ ====================
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cellFor(n) { const rfb = Math.floor((n - 1) / 10), pir = (n - 1) % 10; return { row: 9 - rfb, col: rfb % 2 === 0 ? pir : 9 - pir }; }
function cellAt(row, col) { const rfb = 9 - row, pir = rfb % 2 === 0 ? col : 9 - col; return rfb * 10 + pir + 1; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

// ==================== ВЕСА ====================
const DEFAULT_WEIGHTS = [30, 25, 18, 13, 9, 5];
const DIFFICULTY_WEIGHTS = { easy: [50, 30, 12, 5, 3, 0], normal: [30, 25, 18, 13, 9, 5], hard: [10, 15, 20, 20, 20, 15], nightmare: [5, 10, 15, 20, 25, 25] };
const DIFFICULTY_LABELS = { easy: { name: 'Легко', short: '😊 Легко' }, normal: { name: 'Норма', short: '😐 Норма' }, hard: { name: 'Сложно', short: '😠 Сложно' }, nightmare: { name: 'Хард', short: '💀 Хард' } };
function rollWithWeights(weights) { if (!weights || weights.length !== 6) return 1 + Math.floor(Math.random() * 6); const sum = weights.reduce((a, b) => a + b, 0); if (sum <= 0) return 1 + Math.floor(Math.random() * 6); let r = Math.random() * sum; for (let i = 0; i < 6; i++) { r -= weights[i]; if (r < 0) return i + 1; } return 6; }
function normalizeWeights(w) { const sum = w.reduce((a, b) => a + b, 0); if (sum <= 0) return DEFAULT_WEIGHTS.slice(); const raw = w.map(v => v * 100 / sum); const floored = raw.map(v => Math.floor(v)); let diff = 100 - floored.reduce((a, b) => a + b, 0); const withFrac = raw.map((v, i) => ({ i, frac: v - floored[i] })); withFrac.sort((a, b) => b.frac - a.frac); for (let k = 0; k < diff; k++) floored[withFrac[k % 6].i]++; return floored; }

// ==================== АКСЕССУАРЫ ====================
const ACCESSORIES = [
  { id: 'cap', name: 'Кепка', icon: '🧢', rarity: 'common', desc: '+1% к удаче', effect: { type: 'luck', value: 1 } },
  { id: 'glasses', name: 'Солнечные очки', icon: '🕶️', rarity: 'uncommon', desc: '+2% к удаче', effect: { type: 'luck', value: 2 } },
  { id: 'chain', name: 'Золотая цепочка', icon: '📿', rarity: 'rare', desc: '+5% к заработку', effect: { type: 'earn', value: 5 } },
  { id: 'ring', name: 'Кольцо удачи', icon: '💍', rarity: 'epic', desc: '+3% к удаче', effect: { type: 'luck', value: 3 } },
  { id: 'crown', name: 'Корона', icon: '👑', rarity: 'legendary', desc: '+5% к удаче', effect: { type: 'luck', value: 5 } },
  { id: 'amulet', name: 'Амулет', icon: '🔮', rarity: 'mythic', desc: '+10% к удаче', effect: { type: 'luck', value: 10 } }
];
const RARITY_NAMES = { common: 'Обычный', uncommon: 'Необычный', rare: 'Редкий', epic: 'Эпический', legendary: 'Легендарный', mythic: 'Мифический' };
const RARITY_CLASS = { common: 'rarity-common', uncommon: 'rarity-uncommon', rare: 'rarity-rare', epic: 'rarity-epic', legendary: 'rarity-legendary', mythic: 'rarity-mythic' };
const BASE_RARITY_WEIGHTS = { common: 44.8, uncommon: 35, rare: 15, epic: 4, legendary: 1, mythic: 0.2 };

function getAccessoryById(id) { return ACCESSORIES.find(a => a.id === id); }
function getPlayerLuck() {
  if (!state || !state.equipped) return 0;
  let luck = 0;
  state.equipped.forEach(id => {
    const acc = getAccessoryById(id);
    if (acc && acc.effect.type === 'luck') luck += acc.effect.value;
  });
  return luck;
}
function getPlayerEarnBonus() {
  if (!state || !state.equipped) return 0;
  let earn = 0;
  state.equipped.forEach(id => {
    const acc = getAccessoryById(id);
    if (acc && acc.effect.type === 'earn') earn += acc.effect.value;
  });
  return earn;
}
function rollRarity() {
  const luck = getPlayerLuck();
  const weights = {};
  let total = 0;
  for (const r in BASE_RARITY_WEIGHTS) {
    let w = BASE_RARITY_WEIGHTS[r];
    if (r !== 'common') w *= (1 + luck / 100);
    weights[r] = w;
    total += w;
  }
  let r = Math.random() * total;
  for (const rar in weights) {
    r -= weights[rar];
    if (r < 0) return rar;
  }
  return 'common';
}
function openChest() {
  if (!state) return;
  if (state.crystals < 50) { showToast('Недостаточно кристаллов! Нужно 50 💎', 'error'); return; }
  state.crystals -= 50;
  const rarity = rollRarity();
  const possible = ACCESSORIES.filter(a => a.rarity === rarity);
  let acc;
  if (possible.length === 0) {
    // fallback на common
    const commons = ACCESSORIES.filter(a => a.rarity === 'common');
    acc = commons[Math.floor(Math.random() * commons.length)];
  } else {
    acc = possible[Math.floor(Math.random() * possible.length)];
  }
  let isNew = false;
  if (!state.inventory) state.inventory = [];
  if (!state.inventory.includes(acc.id)) {
    state.inventory.push(acc.id);
    isNew = true;
  } else {
    state.crystals += 10;
    showToast('Дубликат! +10 💎', 'success');
  }
  updateCrystalsDisplay();
  renderInventory();
  savePlayerData();
  // Показать модалку
  const modal = document.getElementById('chestResultModal');
  const content = document.getElementById('chestResultContent');
  content.innerHTML = '<div style="font-size:60px;margin-bottom:8px;">' + acc.icon + '</div>' +
    '<div style="font-size:20px;font-weight:800;margin-bottom:4px;">' + acc.name + '</div>' +
    '<div class="accessory-rarity ' + RARITY_CLASS[acc.rarity] + '" style="font-size:13px;margin-bottom:8px;">' + RARITY_NAMES[acc.rarity] + '</div>' +
    '<div style="font-size:14px;opacity:0.8;margin-bottom:12px;">' + acc.desc + '</div>' +
    (isNew ? '<div style="color:#22c55e;font-weight:700;">✨ Новый аксессуар!</div>' : '<div style="color:#94a3b8;">Уже был в инвентаре</div>');
  modal.style.display = 'flex';
}
function updateCrystalsDisplay() {
  const el = document.getElementById('crystalsDisplay');
  if (el) el.textContent = '💎 ' + (state.crystals || 0);
  const btn = document.getElementById('openChestBtn');
  if (btn) btn.disabled = !state || state.crystals < 50;
}
function renderInventory() {
  const grid = document.getElementById('inventoryGrid');
  if (!grid) return;
  if (!state || !state.inventory || state.inventory.length === 0) {
    grid.innerHTML = '<div style="text-align:center;opacity:0.6;padding:12px;font-size:12px;grid-column:1/-1;">Пока нет аксессуаров. Открой сундук!</div>';
    return;
  }
  let html = '';
  state.inventory.forEach(id => {
    const acc = getAccessoryById(id);
    if (!acc) return;
    const equipped = state.equipped && state.equipped.includes(id);
    html += '<div class="accessory-item ' + (equipped ? 'equipped' : '') + '" data-accid="' + id + '">' +
      '<div class="accessory-icon">' + acc.icon + '</div>' +
      '<div class="accessory-info">' +
      '<div class="accessory-name">' + acc.name + '</div>' +
      '<div class="accessory-desc">' + acc.desc + '</div>' +
      '<div class="accessory-rarity ' + RARITY_CLASS[acc.rarity] + '">' + RARITY_NAMES[acc.rarity] + '</div>' +
      '</div></div>';
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.accessory-item').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.accid;
      if (!state.equipped) state.equipped = [];
      const idx = state.equipped.indexOf(id);
      if (idx >= 0) {
        state.equipped.splice(idx, 1);
        showToast('Снято: ' + getAccessoryById(id).name);
      } else {
        state.equipped.push(id);
        showToast('Надето: ' + getAccessoryById(id).name, 'success');
      }
      savePlayerData();
      renderInventory();
    };
  });
}
function savePlayerData() {
  try {
    localStorage.setItem('zmeyki_crystals', JSON.stringify(state.crystals || 0));
    localStorage.setItem('zmeyki_inventory', JSON.stringify(state.inventory || []));
    localStorage.setItem('zmeyki_equipped', JSON.stringify(state.equipped || []));
  } catch {}
}
function loadPlayerData() {
  try {
    const c = localStorage.getItem('zmeyki_crystals');
    const inv = localStorage.getItem('zmeyki_inventory');
    const eq = localStorage.getItem('zmeyki_equipped');
    return {
      crystals: c ? JSON.parse(c) : 0,
      inventory: inv ? JSON.parse(inv) : [],
      equipped: eq ? JSON.parse(eq) : []
    };
  } catch {
    return { crystals: 0, inventory: [], equipped: [] };
  }
}

// ==================== КОНСТАНТЫ ====================
const PLAYER_META = [
  { id: 1, emoji: '🔴', color: '#ff6b6b', cls: 'p1' },

];

const ACHIEVEMENTS = [
  { id: 'first_win', icon: '🥇', name: 'Первая победа', desc: 'Выиграть матч' },
  { id: 'lucky', icon: '🍀', name: 'Везунчик', desc: '5 зелёных клеток подряд' },
  { id: 'unlucky', icon: '💀', name: 'Неудачник', desc: '3 красные клетки подряд' },
  { id: 'exact_100', icon: '🎯', name: 'Точный', desc: 'Попасть ровно на 100' },
  { id: 'win_3_0', icon: '🔥', name: 'Разгром', desc: 'Выиграть матч 3:0' },
  { id: 'sharer', icon: '📤', name: 'Хвастун', desc: 'Поделиться результатом' }
];

// ==================== STATE ====================
let state = null;
function defaultSettings() { return { theme: 'dark', sound: true, vibrate: true, timer: false, playerCount: 2, vsAI: false, difficulty: 'normal', diceWeights: DEFAULT_WEIGHTS.slice() }; }
function newPlayer(meta, name, isAI) { return { id: meta.id, name: name, emoji: meta.emoji, color: meta.color, cls: meta.cls, pos: 1, score: 0, isAI: !!isAI, stats: { rolls: 0, total: 0, greens: 0, reds: 0, yellows: 0, streakG: 0, streakR: 0, maxStreakG: 0, maxStreakR: 0 } }; }
function newMatch(settings, names) {
  const count = settings.playerCount;
  const players = [];
  for (let i = 0; i < count; i++) {
    const meta = PLAYER_META[i];
    const isAI = settings.vsAI && i === 1 && count === 2;
    players.push(newPlayer(meta, names[i] || ('Игрок ' + (i + 1)), isAI));
  }
  const pd = loadPlayerData();
  state = {
    screen: 'game', players: players, playerCount: count,
    turn: 0, round: 1, rolling: false, gameOver: false, matchOver: false,
    special: null, history: [],
    settings: { theme: settings.theme, sound: settings.sound, vibrate: settings.vibrate, timer: settings.timer, vsAI: settings.vsAI, diceWeights: (settings.diceWeights || DEFAULT_WEIGHTS).slice(), difficulty: settings.difficulty || 'normal' },
    timerData: { timeout: null, remaining: 15 },
    newAchievements: [],
    crystals: pd.crystals,
    inventory: pd.inventory,
    equipped: pd.equipped
  };
  state.special = generateSpecialCells();
  addHistory('▸ Раунд 1 — начинает ' + players[0].name, 'round');
}

// ==================== ГЕНЕРАЦИЯ ====================
function generateSpecialCells() {
  const used = { 1: true, 100: true };
  const yellows = [], reds = [], greens = [];
  const pool = [];
  for (let n = 5; n <= 95; n++) pool.push(n);
  shuffle(pool);
  for (let i = 0; i < pool.length && yellows.length < 4; i++) {
    const from = pool[i];
    if (used[from]) continue;
    const fp = cellFor(from);
    const cand = [];
    if (fp.row > 0) { const a = cellAt(fp.row - 1, fp.col); if (Math.abs(a - from) <= 10 && a >= 2 && a <= 99 && !used[a]) cand.push(a); }
    if (fp.row < 9) { const b = cellAt(fp.row + 1, fp.col); if (Math.abs(b - from) <= 10 && b >= 2 && b <= 99 && !used[b]) cand.push(b); }
    if (cand.length === 0) continue;
    const to = cand[Math.floor(Math.random() * cand.length)];
    yellows.push({ from, to });
    used[from] = used[to] = true;
  }
  for (let i = 0; i < pool.length && reds.length < 3; i++) { const n = pool[i]; if (used[n]) continue; reds.push({ cell: n, delta: -(3 + Math.floor(Math.random() * 5)) }); used[n] = true; }
  for (let i = 0; i < pool.length && greens.length < 3; i++) { const n = pool[i]; if (used[n]) continue; greens.push({ cell: n, delta: 2 + Math.floor(Math.random() * 4) }); used[n] = true; }
  return { yellows, reds, greens };
}
function findYellow(p) { return state.special.yellows.find(y => y.from === p); }
function findRed(p) { return state.special.reds.find(r => r.cell === p); }
function findGreen(p) { return state.special.greens.find(g => g.cell === p); }

// ==================== ОТРИСОВКА ====================
const boardEl = document.getElementById('board');
const svgEl = document.getElementById('overlaySvg');
const msgEl = document.getElementById('msg');
const diceEl = document.getElementById('diceDisplay');
const buttonsRow = document.getElementById('buttonsRow');
const historyList = document.getElementById('historyList');
const scoreBar = document.getElementById('scoreBar');
const timerDisplay = document.getElementById('timerDisplay');

function buildBoard() {
  boardEl.querySelectorAll('.cell').forEach(c => c.remove());
  for (let n = 1; n <= 100; n++) {
    const p = cellFor(n);
    const cell = document.createElement('div');
    cell.className = 'cell';
    const r = findRed(n), g = findGreen(n), y = findYellow(n);
    let d = '';
    if (r) { cell.classList.add('red'); d = '<span class="delta">' + r.delta + '</span>'; }
    else if (g) { cell.classList.add('green'); d = '<span class="delta">+' + g.delta + '</span>'; }
    else if (y) cell.classList.add('yellow');
    if (n === 100) cell.classList.add('finish');
    cell.style.gridRow = (p.row + 1);
    cell.style.gridColumn = (p.col + 1);
    cell.dataset.n = n;
    cell.innerHTML = '<span class="num">' + n + '</span>' + d;
    boardEl.appendChild(cell);
  }
  drawYellowLines();
}
function drawYellowLines() {
  let html = '';
  state.special.yellows.forEach(y => {
    const a = cellFor(y.from), b = cellFor(y.to);
    const x1 = a.col * 10 + 5, y1 = a.row * 10 + 5, x2 = b.col * 10 + 5, y2 = b.row * 10 + 5;
    html += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="rgba(0,0,0,0.6)" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>';
    html += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="url(#yellowGrad)" stroke-width="1.6" stroke-dasharray="2 1.4" stroke-linecap="round" opacity="0.95"/>';
    html += '<circle cx="' + x1 + '" cy="' + y1 + '" r="1" fill="#ffe066" opacity="0.75"/>';
    html += '<circle cx="' + x2 + '" cy="' + y2 + '" r="2" fill="#ffe066" opacity="0.95"/>';
  });
  svgEl.innerHTML = '<defs><linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffd93d"/><stop offset="100%" stop-color="#f39c12"/></linearGradient></defs>' + html;
}
function getCellEl(n) { return boardEl.querySelector('[data-n="' + n + '"]'); }
function flashCell(n) { const c = getCellEl(n); if (!c) return; c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 400); }
function placeTokens() {
  document.querySelectorAll('.token').forEach(t => t.remove());
  const positions = {};
  state.players.forEach(p => { if (!positions[p.pos]) positions[p.pos] = []; positions[p.pos].push(p); });
  for (const pos in positions) {
    const cell = getCellEl(Number(pos)); if (!cell) continue;
    const ps = positions[pos];
    ps.forEach((p, idx) => {
      const t = document.createElement('div');
      t.className = 'token ' + p.cls;
      if (ps.length > 1) t.classList.add('multi', 'pos-' + (idx + 1));
      if (state.players[state.turn] === p && !state.matchOver && !state.gameOver) t.classList.add('active');
      t.textContent = p.id;
      if (ps.length === 1) { const label = document.createElement('div'); label.className = 'token-label ' + p.cls; label.textContent = p.name; t.appendChild(label); }
      cell.appendChild(t);
    });
  }
}

// ==================== UI ====================
function updateScores() {
  let html = '';
  state.players.forEach((p, i) => {
    const active = i === state.turn && !state.matchOver;
    html += '<div class="score-side ' + p.cls + (active ? ' active' : '') + '"><span class="score-name">' + p.emoji + ' ' + escapeHTML(p.name) + '</span><span class="score-num">' + p.score + '</span></div>';
    if (i < state.playerCount - 1) html += '<div class="score-colon">:</div>';
  });
  scoreBar.innerHTML = html;
}
function updateButtons() {
  let html = '';
  state.players.forEach((p, i) => {
    const disabled = (state.turn !== i) || state.rolling || state.gameOver || state.matchOver || p.isAI;
    html += '<button class="dice-btn ' + p.cls + '" data-idx="' + i + '" ' + (disabled ? 'disabled' : '') + '>' + p.emoji + ' ' + escapeHTML(p.name) + '</button>';
  });
  buttonsRow.innerHTML = html;
  buttonsRow.querySelectorAll('.dice-btn').forEach(b => {
    b.addEventListener('click', () => { const idx = parseInt(b.dataset.idx, 10); getAudioCtx(); doRoll(idx); });
  });
}
function updateDiffBadge() {
  const badge = document.getElementById('diffBadge');
  if (!badge) return;
  if (state && state.settings && state.settings.vsAI && state.settings.difficulty) {
    const lbl = DIFFICULTY_LABELS[state.settings.difficulty] || DIFFICULTY_LABELS.normal;
    badge.textContent = '🤖 ' + lbl.short; badge.style.display = 'block';
  } else badge.style.display = 'none';
}
function updateUI() {
  updateScores(); updateButtons(); updateDiffBadge();
  if (!state.gameOver && !state.matchOver) msgEl.textContent = 'Ход ' + state.players[state.turn].name;
  placeTokens();
  updateCrystalsDisplay();
  renderInventory();
}
function addHistory(text, type) { state.history.push({ text, type }); if (state.history.length > 80) state.history.shift(); renderHistory(); }
function renderHistory() {
  let html = '';
  state.history.forEach(h => { html += '<div class="history-item' + (h.type ? ' ' + h.type : '') + '">' + escapeHTML(h.text) + '</div>'; });
  historyList.innerHTML = html;
  historyList.scrollTop = historyList.scrollHeight;
}

// ==================== АНИМАЦИИ ====================
async function animateDice(result) {
  diceEl.classList.add('rolling');
  for (let i = 0; i < 8; i++) { diceEl.textContent = DICE_FACES[Math.floor(Math.random() * 6)]; await sleep(50); }
  diceEl.textContent = DICE_FACES[result - 1];
  diceEl.classList.remove('rolling');
}
async function stepMove(player, target) {
  const step = target > player.pos ? 1 : -1;
  let safety = 0;
  while (player.pos !== target && safety < 120) { player.pos += step; placeTokens(); playSound('step'); await sleep(70); safety++; }
  player.pos = target;
  placeTokens();
}

// ==================== ХОД ====================
async function doRoll(idx) {
  if (!state || state.rolling || state.gameOver || state.matchOver) return;
  if (state.turn !== idx) return;
  if (state.players[idx].isAI) return;
  await performRoll();
}
async function performRoll() {
  state.rolling = true;
  clearTimer();
  updateButtons();
  playSound('dice');
  vibrate(30);
  const player = state.players[state.turn];
  let roll;
  const weightsForRoll = (player.isAI && state.settings.vsAI) ? (DIFFICULTY_WEIGHTS[state.settings.difficulty] || DIFFICULTY_WEIGHTS.normal) : state.settings.diceWeights;
  roll = rollWithWeights(weightsForRoll);
  await animateDice(roll);
  player.stats.rolls++;
  player.stats.total += roll;
  const emoji = player.emoji;
  const fromPos = player.pos;
  const newPos = fromPos + roll;
  if (newPos > 100) {
    if (player.isAI && state.settings.vsAI && state.settings.difficulty === 'nightmare') {
      msgEl.textContent = '💀 ' + player.name + ' — форсаж до 100!';
      addHistory(emoji + ' ' + roll + ' 💀 → 100', player.cls);
      playSound('green'); vibrate([50,30,50]);
      await sleep(400);
      await stepMove(player, 100);
      await winRound();
      return;
    }
    addHistory(emoji + ' ' + roll + ' — перебор, пропуск', player.cls);
    msgEl.textContent = 'Нужно ровно на 100. Ход пропущен.';
    playSound('miss');
    await sleep(1000);
    endTurn();
    return;
  }
  await stepMove(player, newPos);
  msgEl.textContent = 'Выпало ' + roll + ' → ' + player.pos;
  await sleep(200);
  let line = emoji + ' ' + roll + ' → ' + player.pos;
  const y = findYellow(player.pos), r = findRed(player.pos), g = findGreen(player.pos);
  if (y) {
    flashCell(player.pos); playSound('yellow'); vibrate(50);
    msgEl.textContent = '🟡 Лестница! ' + player.pos + ' → ' + y.to;
    line += ' 🟡 → ' + y.to;
    player.stats.yellows++;
    player.stats.streakG = 0; player.stats.streakR = 0;
    await sleep(400); await stepMove(player, y.to); flashCell(y.to); await sleep(300);
  } else if (r) {
    if (player.isAI && state.settings.vsAI && state.settings.difficulty === 'nightmare' && Math.random() < 0.4) {
      flashCell(player.pos); playSound('green'); vibrate(50);
      msgEl.textContent = '🔴 Красная — но 💀 ' + player.name + ' игнорирует!';
      line += ' 🔴💀';
      await sleep(700);
    } else {
      flashCell(player.pos); playSound('red'); vibrate([30,30,30]);
      const t = Math.max(1, player.pos + r.delta);
      msgEl.textContent = '🔴 Красная ' + r.delta + ' → ' + t;
      line += ' 🔴' + r.delta + ' → ' + t;
      player.stats.reds++; player.stats.streakR++; player.stats.streakG = 0;
      if (player.stats.streakR > player.stats.maxStreakR) player.stats.maxStreakR = player.stats.streakR;
      if (player.stats.streakR >= 3) unlockAchievement('unlucky');
      await sleep(400); await stepMove(player, t); flashCell(t); await sleep(300);
    }
  } else if (g) {
    flashCell(player.pos); playSound('green'); vibrate(50);
    const t = Math.min(100, player.pos + g.delta);
    msgEl.textContent = '🟢 Зелёная +' + g.delta + ' → ' + t;
    line += ' 🟢+' + g.delta + ' → ' + t;
    player.stats.greens++; player.stats.streakG++; player.stats.streakR = 0;
    if (player.stats.streakG > player.stats.maxStreakG) player.stats.maxStreakG = player.stats.streakG;
    if (player.stats.streakG >= 5) unlockAchievement('lucky');
    await sleep(400); await stepMove(player, t); flashCell(t); await sleep(300);
  } else { player.stats.streakG = 0; player.stats.streakR = 0; }
  addHistory(line, player.cls);
  if (player.pos === 100) { if (roll === 100 - fromPos) unlockAchievement('exact_100'); await winRound(); return; }
  saveState();
  endTurn();
}
function endTurn() {
  if (state.gameOver || state.matchOver) { state.rolling = false; updateUI(); return; }
  state.turn = (state.turn + 1) % state.playerCount;
  state.rolling = false;
  updateUI();
  saveState();
  const next = state.players[state.turn];
  if (next.isAI) { setTimeout(() => { if (!state.gameOver && !state.matchOver && state.turn === state.players.indexOf(next)) performRoll(); }, 900); }
  else if (state.settings.timer) startTimer();
}

// ==================== ПОБЕДА ====================
async function winRound() {
  const player = state.players[state.turn];
  player.score++;
  updateScores();
  playSound('win'); vibrate([100,50,100,50,100]);
  addHistory('🎉 Раунд ' + state.round + ': ' + player.name + ' выиграл!', 'round');
  if (player.score >= 3) {
    state.matchOver = true; state.gameOver = true; state.rolling = false;
    // Начисление кристаллов за победу в матче
    const earnBonus = getPlayerEarnBonus();
    const reward = Math.round(25 * (1 + earnBonus / 100));
    state.crystals += reward;
    savePlayerData();
    updateCrystalsDisplay();
    addHistory('💎 +' + reward + ' кристаллов за победу!', 'round');
    saveRecords(player);
    if (player.score === 3 && state.players.every(p => p === player || p.score === 0)) unlockAchievement('win_3_0');
    unlockAchievement('first_win');
    clearSaveState();
    await sleep(400);
    showWinScreen(player);
    return;
  }
  state.gameOver = true; state.rolling = false;
  msgEl.textContent = '🎉 ' + player.name + ' выиграл раунд ' + state.round + '!';
  updateUI();
  await sleep(1600);
  state.round++;
  state.players.forEach(p => { p.pos = 1; p.stats.streakG = 0; p.stats.streakR = 0; });
  state.turn = (state.round - 1) % state.playerCount;
  state.rolling = false; state.gameOver = false;
  diceEl.textContent = '🎲';
  state.special = generateSpecialCells();
  buildBoard();
  addHistory('▸ Раунд ' + state.round + ' — начинает ' + state.players[state.turn].name, 'round');
  updateUI();
  saveState();
  const next = state.players[state.turn];
  if (next.isAI) setTimeout(() => { if (!state.gameOver && !state.matchOver) performRoll(); }, 900);
  else if (state.settings.timer) startTimer();
}

// ==================== ТАЙМЕР ====================
function startTimer() {
  clearTimer();
  if (!state.settings.timer) return;
  if (state.players[state.turn].isAI) return;
  if (state.gameOver || state.matchOver) return;
  state.timerData.remaining = 15;
  timerDisplay.style.display = 'block';
  timerDisplay.classList.remove('urgent');
  timerDisplay.textContent = '15';
  state.timerData.timeout = setInterval(() => {
    state.timerData.remaining--;
    timerDisplay.textContent = state.timerData.remaining;
    if (state.timerData.remaining <= 5) timerDisplay.classList.add('urgent');
    if (state.timerData.remaining <= 0) {
      clearTimer();
      const p = state.players[state.turn];
      addHistory(p.emoji + ' ⏱ пропуск', p.cls);
      msgEl.textContent = '⏱ Время вышло, ход пропущен';
      playSound('miss');
      endTurn();
    }
  }, 1000);
}
function clearTimer() {
  if (state && state.timerData.timeout) { clearInterval(state.timerData.timeout); state.timerData.timeout = null; }
  if (timerDisplay) { timerDisplay.style.display = 'none'; timerDisplay.classList.remove('urgent'); }
}

// ==================== КАРТИНКА ====================
function getWinImage() { try { return localStorage.getItem('zmeyki_win_image'); } catch { return null; } }
function saveWinImage(dataUrl) { try { localStorage.setItem('zmeyki_win_image', dataUrl); } catch (e) { showToast('Не удалось сохранить картинку — нет места', 'error'); } }
function removeWinImage() { try { localStorage.removeItem('zmeyki_win_image'); } catch {} }
function updateWinImage() {
  const img = document.getElementById('winImage');
  const wrap = document.getElementById('winImageWrap');
  const removeBtn = document.getElementById('removeWinBtn');

  else { img.src = ''; wrap.style.display = 'none'; removeBtn.style.display = 'none'; }
}

// ==================== ЭКРАН ПОБЕДЫ ====================
function showWinScreen(winner) {
  state.screen = 'win';
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('winScreen').style.display = 'flex';
  const otherMax = Math.max(...state.players.filter(p => p !== winner).map(p => p.score));
  document.getElementById('winTitle').textContent = winner.emoji + ' ' + winner.name + ' выиграл!';
  document.getElementById('winScore').textContent = 'Счёт: ' + winner.score + ' : ' + otherMax;
  let stats = '';
  state.players.forEach(p => {
    const avg = p.stats.rolls > 0 ? (p.stats.total / p.stats.rolls).toFixed(1) : '0';
    const diffTag = (p.isAI && state.settings.vsAI) ? ' (' + (DIFFICULTY_LABELS[state.settings.difficulty] || DIFFICULTY_LABELS.normal).short + ')' : '';
    stats += '<div class="stat-row"><span>' + p.emoji + ' ' + escapeHTML(p.name) + diffTag + '</span><span>🎲 ' + p.stats.rolls + ' | ср. ' + avg + '</span></div><div class="stat-row"><span style="opacity:0.6;font-size:11px">🟢 ' + p.stats.greens + ' | 🔴 ' + p.stats.reds + ' | 🟡 ' + p.stats.yellows + '</span></div>';
  });
  document.getElementById('winStats').innerHTML = stats;
  const newAch = state.newAchievements || [];
  const achEl = document.getElementById('winNewAch');
  if (newAch.length > 0) {
    achEl.style.display = 'block';
    achEl.innerHTML = '🏅 Новые достижения:<br>' + newAch.map(a => ACHIEVEMENTS.find(x => x.id === a)).filter(Boolean).map(a => a.icon + ' ' + a.name).join(', ');
  } else achEl.style.display = 'none';
  updateWinImage();
  launchConfetti();
}
function launchConfetti() {
  const colors = ['#ff6b6b','#4ea8ff','#a855f7','#ec4899','#ffd93d','#4ecdc4'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    const col = colors[Math.floor(Math.random() * colors.length)];
    c.style.background = col; c.style.color = col;
    c.style.animationDelay = (Math.random() * 1.5) + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

// ==================== ДОСТИЖЕНИЯ, РЕКОРДЫ ====================
function getAchievements() { try { return JSON.parse(localStorage.getItem('zmeyki_ach') || '{}'); } catch { return {}; } }
function saveAchievements(a) { try { localStorage.setItem('zmeyki_ach', JSON.stringify(a)); } catch {} }
function unlockAchievement(id) {
  const all = getAchievements();
  if (all[id]) return;
  all[id] = Date.now();
  saveAchievements(all);
  if (!state.newAchievements) state.newAchievements = [];
  if (!state.newAchievements.includes(id)) state.newAchievements.push(id);
}
function getRecords() { try { return JSON.parse(localStorage.getItem('zmeyki_rec') || '{"wins":{},"total":0}'); } catch { return { wins: {}, total: 0 }; } }
function saveRecords(winner) {
  const r = getRecords();
  r.wins[winner.cls] = (r.wins[winner.cls] || 0) + 1;
  r.total = (r.total || 0) + 1;
  try { localStorage.setItem('zmeyki_rec', JSON.stringify(r)); } catch {}
}
function showRecords() {
  const r = getRecords();
  let html = '';
  PLAYER_META.forEach(m => { const w = r.wins[m.cls] || 0; if (w > 0) html += '<div class="record-row">' + m.emoji + ' Игрок ' + m.id + ' — побед: ' + w + '</div>'; });
  if (!html) html = '<div style="text-align:center;opacity:0.6;padding:20px">Пока нет завершённых матчей</div>';
  html += '<div style="margin-top:12px;text-align:center;opacity:0.6;font-size:12px">Всего матчей: ' + (r.total || 0) + '</div>';
  document.getElementById('recordsList').innerHTML = html;
  document.getElementById('recordsModal').style.display = 'flex';
}
function showAchievements() {
  const unlocked = getAchievements();
  let html = '';
  ACHIEVEMENTS.forEach(a => {
    const isOn = !!unlocked[a.id];
    html += '<div class="ach-row ' + (isOn ? '' : 'locked') + '"><div class="ach-icon">' + a.icon + '</div><div><div class="ach-name">' + a.name + '</div><div class="ach-desc">' + a.desc + '</div></div></div>';
  });
  document.getElementById('achievementsList').innerHTML = html;
  document.getElementById('achievementsModal').style.display = 'flex';
}

// ==================== СОХРАНЕНИЕ МАТЧА ====================
function saveState() {
  if (!state || state.matchOver) return;
  try { const copy = JSON.parse(JSON.stringify(state)); delete copy.timerData; delete copy.newAchievements; copy.rolling = false; localStorage.setItem('zmeyki_state', JSON.stringify(copy)); } catch {}
}
function clearSaveState() { try { localStorage.removeItem('zmeyki_state'); } catch {} }
function loadState() {
  try {
    const raw = localStorage.getItem('zmeyki_state');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.players || s.matchOver) return null;
    s.timerData = { timeout: null, remaining: 15 };
    s.newAchievements = [];
    s.rolling = false;
    if (!s.settings.diceWeights || s.settings.diceWeights.length !== 6) s.settings.diceWeights = DEFAULT_WEIGHTS.slice();
    if (!s.settings.difficulty) s.settings.difficulty = 'normal';
    const pd = loadPlayerData();
    s.crystals = pd.crystals;
    s.inventory = pd.inventory;
    s.equipped = pd.equipped;
    return s;
  } catch { return null; }
}
function getSettings() { try { return JSON.parse(localStorage.getItem('zmeyki_set') || '{}'); } catch { return {}; } }
function saveSettings(s) { try { localStorage.setItem('zmeyki_set', JSON.stringify(s)); } catch {} }

// ==================== НАВИГАЦИЯ ====================
function showScreen(name) {
  document.getElementById('settingsScreen').classList.toggle('hidden', name !== 'settings');
  document.getElementById('gameScreen').classList.toggle('hidden', name !== 'game');
  document.getElementById('winScreen').style.display = (name === 'win') ? 'flex' : 'none';
}
function startNewGame(settings, names) {
  clearSaveState(); clearTimer();
  newMatch(settings, names);
  state.newAchievements = [];
  document.body.dataset.theme = settings.theme;
  buildBoard();
  showScreen('game');
  updateUI();
  saveState();
  if (state.players[state.turn].isAI) setTimeout(() => performRoll(), 900);
  else if (state.settings.timer) startTimer();
}
function resumeGame(savedState) {
  state = savedState;
  state.newAchievements = [];
  state.timerData = { timeout: null, remaining: 15 };
  if (!state.settings.diceWeights || state.settings.diceWeights.length !== 6) state.settings.diceWeights = DEFAULT_WEIGHTS.slice();
  if (!state.settings.difficulty) state.settings.difficulty = 'normal';
  document.body.dataset.theme = state.settings.theme;
  buildBoard();
  renderHistory();
  showScreen('game');
  updateUI();
  if (state.players[state.turn].isAI) setTimeout(() => performRoll(), 900);
  else if (state.settings.timer) startTimer();
}
function goBackToCurrentGame() {
  document.body.dataset.theme = state.settings.theme;
  showScreen('game');
  updateUI();
  if (state.players[state.turn].isAI && !state.gameOver && !state.matchOver) setTimeout(() => performRoll(), 900);
  else if (state.settings.timer && !state.gameOver && !state.matchOver) startTimer();
}

// ==================== НАСТРОЙКИ UI ====================
function buildChancesUI(initialWeights) {
  const wrap = document.getElementById('diceChances');
  wrap.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const item = document.createElement('div');
    item.className = 'chance-item';
    item.innerHTML = '<div class="chance-face">' + DICE_FACES[i] + '</div><input type="number" min="0" max="100" step="1" class="chance-input" data-face="' + i + '" value="' + initialWeights[i] + '"><div class="chance-pct">' + (i + 1) + '</div>';
    wrap.appendChild(item);
  }
  wrap.querySelectorAll('.chance-input').forEach(inp => inp.addEventListener('input', updateChanceSum));
  updateChanceSum();
}
function getCurrentWeights() {
  const inputs = document.querySelectorAll('.chance-input');
  const w = [];
  inputs.forEach(inp => { let v = parseInt(inp.value, 10); if (isNaN(v) || v < 0) v = 0; if (v > 100) v = 100; w.push(v); });
  return w;
}
function updateChanceSum() {
  const w = getCurrentWeights();
  const sum = w.reduce((a, b) => a + b, 0);
  const el = document.getElementById('chanceSum');
  el.textContent = 'Сумма: ' + sum + '%' + (sum === 100 ? ' ✓' : ' (нужно 100%)');
  el.classList.toggle('invalid', sum !== 100);
  document.querySelectorAll('.chance-input').forEach(inp => inp.classList.toggle('invalid', sum !== 100));
  return sum;
}
function setWeightsTo(w) { const inputs = document.querySelectorAll('.chance-input'); inputs.forEach((inp, i) => { inp.value = w[i]; }); updateChanceSum(); }

function setupSettingsUI() {
  const saved = getSettings();
  const defaults = defaultSettings();
  const cfg = Object.assign({}, defaults, saved);
  if (!cfg.diceWeights || cfg.diceWeights.length !== 6) cfg.diceWeights = DEFAULT_WEIGHTS.slice();
  if (!cfg.difficulty) cfg.difficulty = 'normal';

  document.body.dataset.theme = cfg.theme;
  document.getElementById('themeSelect').value = cfg.theme;

  buildChancesUI(cfg.diceWeights);
  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.onclick = () => {
      const p = btn.dataset.preset;
      if (p === 'equal') setWeightsTo([17,17,17,17,16,16]);
      else if (p === 'high') setWeightsTo([30,25,18,13,9,5]);
      else if (p === 'low') setWeightsTo([5,9,13,18,25,30]);
      else if (p === 'normalize') setWeightsTo(normalizeWeights(getCurrentWeights()));
    };
  });

  let playerCount = cfg.playerCount || 2;
  let vsAI = cfg.vsAI || false;
  let difficulty = cfg.difficulty;

  const updateDiffVisibility = () => { document.getElementById('difficultySection').style.display = (playerCount === 2 && vsAI) ? 'block' : 'none'; };
  const setDiff = v => {
    difficulty = v;
    document.querySelectorAll('[data-diff]').forEach(x => x.classList.toggle('active', x.dataset.diff === v));
    const desc = {
      easy: '😊 ИИ бросает медленно (чаще 1-2), часто не доходит до 100 — победа почти гарантирована',
      normal: '😐 Равные шансы — кто первым дойдёт до 100',
      hard: '😠 ИИ бросает быстро (чаще 5-6) — он будет впереди большую часть игры',
      nightmare: '💀 ИИ бросает очень быстро + игнорирует красные (40%) + при переборе упирается в 100. Победа — почти чудо'
    };
    document.getElementById('diffDesc').textContent = desc[v] || '';
  };
  setDiff(difficulty);
  document.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => setDiff(b.dataset.diff));

  document.querySelectorAll('[data-pc]').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.pc, 10) === playerCount);
    b.onclick = () => {
      playerCount = parseInt(b.dataset.pc, 10);
      document.querySelectorAll('[data-pc]').forEach(x => x.classList.toggle('active', x === b));
      document.getElementById('nameRow3').style.display = playerCount >= 3 ? 'flex' : 'none';
      document.getElementById('nameRow4').style.display = playerCount >= 4 ? 'flex' : 'none';
      document.getElementById('vsAIRow').style.display = playerCount === 2 ? 'flex' : 'none';
      updateDiffVisibility();
    };
  });
  document.getElementById('nameRow3').style.display = playerCount >= 3 ? 'flex' : 'none';
  document.getElementById('nameRow4').style.display = playerCount >= 4 ? 'flex' : 'none';
  document.getElementById('vsAIRow').style.display = playerCount === 2 ? 'flex' : 'none';
  document.getElementById('name1').value = cfg.name1 || 'Игрок 1';
  document.getElementById('name2').value = cfg.name2 || 'Игрок 2';
  document.getElementById('name3').value = cfg.name3 || 'Игрок 3';
  document.getElementById('name4').value = cfg.name4 || 'Игрок 4';

  const setAI = v => { vsAI = v; document.getElementById('vsAIYes').classList.toggle('active', v); document.getElementById('vsAINo').classList.toggle('active', !v); updateDiffVisibility(); };
  setAI(vsAI);
  document.getElementById('vsAIYes').onclick = () => setAI(true);
  document.getElementById('vsAINo').onclick = () => setAI(false);

  let sound = cfg.sound !== false;
  const setSnd = v => { sound = v; document.getElementById('soundOn').classList.toggle('active', v); document.getElementById('soundOff').classList.toggle('active', !v); };
  setSnd(sound);
  document.getElementById('soundOn').onclick = () => setSnd(true);
  document.getElementById('soundOff').onclick = () => setSnd(false);

  let vib = cfg.vibrate !== false;
  const setVib = v => { vib = v; document.getElementById('vibOn').classList.toggle('active', v); document.getElementById('vibOff').classList.toggle('active', !v); };
  setVib(vib);
  document.getElementById('vibOn').onclick = () => setVib(true);
  document.getElementById('vibOff').onclick = () => setVib(false);

  let timer = cfg.timer || false;
  const setTmr = v => { timer = v; document.getElementById('timerOn').classList.toggle('active', v); document.getElementById('timerOff').classList.toggle('active', !v); };
  setTmr(timer);
  document.getElementById('timerOn').onclick = () => setTmr(true);
  document.getElementById('timerOff').onclick = () => setTmr(false);
  document.getElementById('themeSelect').onchange = e => { document.body.dataset.theme = e.target.value; };

  // Инвентарь
  if (state) {
    updateCrystalsDisplay();
    renderInventory();
  }
  document.getElementById('openChestBtn').onclick = () => { if (state) openChest(); };

  if (state && !state.matchOver) saveState();

  document.getElementById('startBtn').onclick = () => {
    getAudioCtx();
    let weights = getCurrentWeights();
    const sum = weights.reduce((a, b) => a + b, 0);
    if (sum !== 100) { weights = normalizeWeights(weights); setWeightsTo(weights); showToast('Шансы нормализованы до 100%'); }
    const proceed = () => {
      const finalWeights = getCurrentWeights();
      const names = [
        document.getElementById('name1').value.trim() || 'Игрок 1',
        document.getElementById('name2').value.trim() || 'Игрок 2',
        document.getElementById('name3').value.trim() || 'Игрок 3',
        document.getElementById('name4').value.trim() || 'Игрок 4'
      ];
      const s = { theme: document.getElementById('themeSelect').value, sound, vibrate: vib, timer, playerCount, vsAI, name1: names[0], name2: names[1], name3: names[2], name4: names[3], diceWeights: finalWeights, difficulty };
      saveSettings(s);
      startNewGame(s, names);
    };
    if (state && !state.matchOver && state.players && state.players.length > 0) {
      showModalConfirm('Начать новый матч?\n\nТекущий прогресс будет потерян.\nЕсли хочешь вернуться — нажми «Продолжить» сверху.', proceed);
    } else {
      proceed();
    }
  };

  document.getElementById('recordsBtn').onclick = showRecords;
  document.getElementById('achievementsBtn').onclick = showAchievements;

  const contBtn = document.getElementById('continueBtn');
  const savedState = loadState();
  if (state && !state.matchOver && state.players) {
    contBtn.disabled = false;
    contBtn.classList.add('continue-active');
    contBtn.textContent = '⏯ Продолжить матч — ' + state.players.map(p => p.name + ' ' + p.score).join(' : ');
    contBtn.onclick = () => goBackToCurrentGame();
  } else if (savedState) {
    contBtn.disabled = false;
    contBtn.classList.add('continue-active');
    contBtn.textContent = '⏯ Загрузить матч — ' + savedState.players.map(p => p.name + ' ' + p.score).join(' : ');
    contBtn.onclick = () => resumeGame(savedState);
  } else {
    contBtn.disabled = true;
    contBtn.classList.remove('continue-active');
    contBtn.textContent = '⏯ Нет сохранённого матча';
    contBtn.onclick = null;
  }
}

// ==================== ИГРОВЫЕ КНОПКИ ====================
document.getElementById('restartBtn').onclick = () => {
  if (!state) return;
  showModalConfirm('Начать новый матч?\n\nТекущий прогресс потеряется.', () => {
    clearTimer(); clearSaveState();
    startNewGame(state.settings, state.players.map(p => p.name));
  });
};
document.getElementById('settingsBtn').onclick = () => {
  if (state && !state.matchOver) saveState();
  clearTimer();
  showScreen('settings');
  setupSettingsUI();
};
document.getElementById('newMatchBtn').onclick = () => {
  document.getElementById('winScreen').style.display = 'none';
  clearSaveState();
  startNewGame(state.settings, state.players.map(p => p.name));
};
document.getElementById('toSettingsBtn').onclick = () => {
  document.getElementById('winScreen').style.display = 'none';
  showScreen('settings');
  setupSettingsUI();
};
document.getElementById('shareBtn').onclick = async () => {
  if (!state) return;
  const winner = state.players.find(p => p.score >= 3);
  if (!winner) return;
  unlockAchievement('sharer');
  const otherScore = Math.max(...state.players.filter(p => p !== winner).map(p => p.score));
  const diffTag = (state.settings.vsAI && state.settings.difficulty) ? ' [' + (DIFFICULTY_LABELS[state.settings.difficulty] || DIFFICULTY_LABELS.normal).name + ']' : '';
  const text = winner.emoji + ' ' + winner.name + ' выиграл в "Змейки и Лестницы" со счётом ' + winner.score + ':' + otherScore + diffTag + '! 🎲';
  if (navigator.share) { try { await navigator.share({ title: 'Змейки и Лестницы', text }); } catch {} }
  else if (navigator.clipboard) { try { await navigator.clipboard.writeText(text); showToast('Скопировано в буфер', 'success'); } catch {} }
  else showToast(text);
};

document.getElementById('uploadWinBtn').onclick = () => document.getElementById('winImageInput').click();
document.getElementById('removeWinBtn').onclick = () => {
  showModalConfirm('Удалить картинку?', () => { removeWinImage(); updateWinImage(); });
};
document.getElementById('winImageInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Это не картинка', 'error'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxSize = 800;
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = h * maxSize / w; w = maxSize; }
        else { w = w * maxSize / h; h = maxSize; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      saveWinImage(dataUrl);
      updateWinImage();
      showToast('Картинка сохранена!', 'success');
    };
    img.onerror = () => showToast('Не удалось прочитать картинку', 'error');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
setupSettingsUI();
showScreen('settings');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
